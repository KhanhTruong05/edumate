worker_processes auto;
pid /tmp/edumate-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/edumate-client-body;
    proxy_temp_path /tmp/edumate-proxy;
    fastcgi_temp_path /tmp/edumate-fastcgi;
    uwsgi_temp_path /tmp/edumate-uwsgi;
    scgi_temp_path /tmp/edumate-scgi;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 2m;

        # FastAPI binds to loopback only, in the same container.
        # Do not reinterpret client-supplied forwarded IP headers as demo identity.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_read_timeout 65s;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
        }
        location = /health {
            proxy_pass http://127.0.0.1:8000;
        }
        location = /docs {
            proxy_pass http://127.0.0.1:8000;
        }
        location = /redoc {
            proxy_pass http://127.0.0.1:8000;
        }
        location = /openapi.json {
            proxy_pass http://127.0.0.1:8000;
        }
        location /assets/ {
            try_files $uri =404;
            expires 30d;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
