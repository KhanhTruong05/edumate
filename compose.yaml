services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${EDUMATE_PORT:-8080}:8080"
    environment:
      DEMO_PROXY_TOKEN: "${DEMO_PROXY_TOKEN:-edumate-local-demo-proxy}"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    restart: unless-stopped
    init: true

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_MODE: demo
      EDUMATE_DATA_DIR: /data
      DEMO_PROXY_TOKEN: "${DEMO_PROXY_TOKEN:-edumate-local-demo-proxy}"
      AI_SERVICE_URL: http://ai:8001
      AI_SERVICE_TOKEN: "${AI_SERVICE_TOKEN:-edumate-local-ai-service}"
    volumes:
      - edumate_data:/data
    networks:
      - web
      - intelligence
    restart: unless-stopped
    init: true
    stop_grace_period: 25s

  ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      AI_SERVICE_TOKEN: "${AI_SERVICE_TOKEN:-edumate-local-ai-service}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
    networks:
      - intelligence
    restart: unless-stopped
    init: true
    stop_grace_period: 25s

networks:
  web:
  intelligence:

volumes:
  edumate_data:
