[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edumate-ai"
version = "0.1.0"
description = "Standalone draft generation and citation checks for EduMate"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]
